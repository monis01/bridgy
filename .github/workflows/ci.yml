name: CI

# Checks every pull request and every push to development.
# Pushes to main are checked by publish.yml before it publishes.

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (also builds via "prepare")
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run
