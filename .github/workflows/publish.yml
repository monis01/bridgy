name: Publish to npm

# Runs on every merge/push to main.
# Publishes only when the version in package.json is not on npm yet, so
# merges that don't bump the version simply run the checks and stop.
#
# To release: bump the version on development (`npm version patch|minor|major`),
# let the release PR carry it to main, merge it. This workflow then publishes
# to npm, tags vX.Y.Z and creates a GitHub Release.
#
# Auth uses npm Trusted Publishing (no token). One-time setup on npmjs.com:
#   package → Settings → Trusted Publisher → GitHub Actions
#   owner: monis01   repository: bridgy   workflow: publish.yml

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # create the git tag + GitHub Release
  id-token: write   # npm Trusted Publishing (OIDC)

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Update npm (Trusted Publishing needs npm 11.5.1+)
        run: npm install -g npm@latest

      - name: Install dependencies (also builds via "prepare")
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Is this version already on npm?
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on npm. Bump the version to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish

      - name: Tag and create GitHub Release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
