<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="bridgeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="windowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#2d2d3f"/>
    </linearGradient>
  </defs>

  <!-- Parent Window -->
  <rect x="20" y="20" width="80" height="80" rx="8" fill="url(#windowGradient)" stroke="#6366f1" stroke-width="2"/>
  <rect x="30" y="35" width="60" height="8" rx="2" fill="#4ade80" opacity="0.8"/>
  <rect x="30" y="50" width="45" height="6" rx="2" fill="#94a3b8" opacity="0.5"/>
  <rect x="30" y="62" width="55" height="6" rx="2" fill="#94a3b8" opacity="0.5"/>
  <rect x="30" y="74" width="35" height="6" rx="2" fill="#94a3b8" opacity="0.5"/>

  <!-- Child Window (iframe) -->
  <rect x="300" y="20" width="80" height="80" rx="8" fill="url(#windowGradient)" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="310" y="35" width="60" height="8" rx="2" fill="#f472b6" opacity="0.8"/>
  <rect x="310" y="50" width="50" height="6" rx="2" fill="#94a3b8" opacity="0.5"/>
  <rect x="310" y="62" width="40" height="6" rx="2" fill="#94a3b8" opacity="0.5"/>
  <rect x="310" y="74" width="55" height="6" rx="2" fill="#94a3b8" opacity="0.5"/>

  <!-- Bridge Connection -->
  <path d="M100 60 C150 60, 150 40, 200 40 C250 40, 250 60, 300 60"
        fill="none" stroke="url(#bridgeGradient)" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 60 C150 60, 150 80, 200 80 C250 80, 250 60, 300 60"
        fill="none" stroke="url(#bridgeGradient)" stroke-width="4" stroke-linecap="round"/>

  <!-- Data packets -->
  <circle cx="150" cy="48" r="6" fill="#4ade80">
    <animate attributeName="cx" values="120;280" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="72" r="6" fill="#f472b6">
    <animate attributeName="cx" values="280;120" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Bridge pillars -->
  <rect x="145" y="38" width="10" height="44" rx="2" fill="url(#bridgeGradient)" opacity="0.6"/>
  <rect x="245" y="38" width="10" height="44" rx="2" fill="url(#bridgeGradient)" opacity="0.6"/>

  <!-- Text -->
  <text x="200" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#e2e8f0" text-anchor="middle">Bridgy</text>
</svg>
