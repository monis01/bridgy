<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" role="img" aria-labelledby="t d">
  <title id="t">Bridgy</title>
  <desc id="d">A parent window and an iframe joined by a bridge, with messages crossing in both directions.</desc>
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="166" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2740"/>
      <stop offset="1" stop-color="#1C1A2B"/>
    </linearGradient>
    <style>
      .word { fill: #161427; }
      .tag  { fill: #6B6880; }
      @media (prefers-color-scheme: dark) {
        .word { fill: #F4F3FA; }
        .tag  { fill: #A7A4BC; }
      }
      .pkt-out  { animation: out 2.4s cubic-bezier(.45,0,.55,1) infinite; }
      .pkt-back { animation: back 2.4s cubic-bezier(.45,0,.55,1) infinite 1.2s; opacity: 0; }
      @keyframes out  { 0% { transform: translateX(0);    opacity: 0 } 15%,85% { opacity: 1 } 100% { transform: translateX(56px);  opacity: 0 } }
      @keyframes back { 0% { transform: translateX(0);    opacity: 0 } 15%,85% { opacity: 1 } 100% { transform: translateX(-56px); opacity: 0 } }
      @media (prefers-reduced-motion: reduce) {
        .pkt-out, .pkt-back { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Parent window -->
  <rect x="14" y="34" width="76" height="92" rx="16" fill="url(#pane)" stroke="#6366F1" stroke-width="3"/>
  <circle cx="30" cy="50" r="3.5" fill="#6366F1"/>
  <circle cx="41" cy="50" r="3.5" fill="#6366F1" opacity=".6"/>
  <circle cx="52" cy="50" r="3.5" fill="#6366F1" opacity=".35"/>
  <rect x="28" y="66" width="48" height="7" rx="3.5" fill="#22C55E"/>
  <rect x="28" y="80" width="36" height="6" rx="3" fill="#4B4865"/>
  <rect x="28" y="92" width="42" height="6" rx="3" fill="#4B4865"/>
  <rect x="28" y="104" width="28" height="6" rx="3" fill="#4B4865"/>

  <!-- Child iframe (dashed = embedded frame) -->
  <rect x="166" y="34" width="76" height="92" rx="16" fill="url(#pane)" stroke="#A855F7" stroke-width="3" stroke-dasharray="7 5"/>
  <rect x="180" y="50" width="48" height="7" rx="3.5" fill="#EC4899"/>
  <rect x="180" y="64" width="36" height="6" rx="3" fill="#4B4865"/>
  <rect x="180" y="76" width="42" height="6" rx="3" fill="#4B4865"/>
  <rect x="180" y="88" width="28" height="6" rx="3" fill="#4B4865"/>

  <!-- Bridge: arch, hangers, deck -->
  <path d="M90 100 Q128 46 166 100" fill="none" stroke="url(#brand)" stroke-width="5" stroke-linecap="round"/>
  <g stroke="url(#brand)" stroke-width="2.5" stroke-linecap="round" opacity=".75">
    <line x1="109" y1="80" x2="109" y2="100"/>
    <line x1="128" y1="73" x2="128" y2="100"/>
    <line x1="147" y1="80" x2="147" y2="100"/>
  </g>
  <line x1="90" y1="100" x2="166" y2="100" stroke="url(#brand)" stroke-width="6" stroke-linecap="round"/>

  <!-- Messages: request out (green), reply back (pink) -->
  <circle class="pkt-out"  cx="100" cy="90" r="5.5" fill="#22C55E"/>
  <circle class="pkt-back" cx="156" cy="110" r="5.5" fill="#EC4899"/>

  <!-- Wordmark -->
  <text class="word" x="272" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">Bridgy</text>
  <text class="tag" x="275" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" letter-spacing=".4">secure iframe messaging</text>
</svg>
